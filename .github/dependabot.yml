# Dependabot version updates. Source: the consumer template of strangebasisdevs/strange_security.
version: 2

# The feeds Directory.Build.targets restores from. Dependabot does not read that
# property, and its proxy refuses hosts it has not been told about.
registries:
  bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json
  windows10ce:
    type: nuget-feed
    url: https://nuget.windows10ce.com/nuget/v3/index.json

updates:
  - package-ecosystem: nuget
    directory: /src/VacationPlanner
    registries: "*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
    # Delay adopting a newly published release; compromised releases are usually
    # caught and yanked quickly.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    # Delay adopting a newly published release; compromised releases are usually
    # caught and yanked quickly.
    cooldown:
      default-days: 7
