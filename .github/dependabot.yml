# Dependabot version updates. Source: the consumer template of strangebasisdevs/strange_security.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/VacationPlanner
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
    # Delay adopting a newly published release; compromised releases are usually
    # caught and yanked quickly.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    # Delay adopting a newly published release; compromised releases are usually
    # caught and yanked quickly.
    cooldown:
      default-days: 7
